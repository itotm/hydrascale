version: 2

project_name: hydrascale

builds:
  - id: hydrascale
    main: ./cmd/hydrascale
    binary: hydrascale
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - contrib/

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github-native

release:
  # The fork tags releases as v<upstream>-fork.<n>. Semver reads the suffix as a
  # pre-release, and GitHub leaves a pre-release out of releases/latest, which the
  # horizon-os build reads. Every fork release is therefore a full release.
  prerelease: false
